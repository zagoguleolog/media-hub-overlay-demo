<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00000000" />
    <title>Media Hub · Android Overlay Lab</title>
    <meta
      name="description"
      content="Прозрачный HTML overlay для проверки Android WebView: glass-плашки, blur, opacity и анимация."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="overlay" aria-label="Диагностический HTML overlay Media Hub">
      <div class="safe-frame" aria-hidden="true"></div>

      <header class="brand glass glass--strong">
        <svg class="brand__mark" viewBox="0 0 48 48" role="img" aria-label="Логотип Media Hub">
          <defs>
            <linearGradient id="mark-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#72f7dc" />
              <stop offset="1" stop-color="#6d7dff" />
            </linearGradient>
          </defs>
          <path d="M6 13.5 24 3l18 10.5v21L24 45 6 34.5Z" fill="none" stroke="url(#mark-gradient)" stroke-width="2" />
          <path d="m15 31 9-16 9 16-9-5.2Z" fill="url(#mark-gradient)" />
        </svg>
        <div>
          <p class="eyebrow">Media Hub</p>
          <h1>Overlay Lab</h1>
        </div>
        <span class="live"><i></i> live</span>
      </header>

      <section class="status glass" aria-label="Состояние overlay">
        <p class="eyebrow">Android compositor</p>
        <div class="status__row">
          <strong>Scene 01</strong>
          <span class="status__time" id="clock">00:00:00</span>
        </div>
        <div class="meter" aria-label="Уровень сигнала"><span></span></div>
        <dl class="facts">
          <div><dt>viewport</dt><dd id="viewport">—</dd></div>
          <div><dt>blur</dt><dd id="blur-status">checking</dd></div>
          <div><dt>motion</dt><dd id="motion-status">on</dd></div>
        </dl>
      </section>

      <section class="blur-lab" aria-label="Тест размытия и прозрачности">
        <div class="blur-lab__source" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="blur-lab__card glass glass--blur-test">
          <p class="eyebrow">Backdrop test</p>
          <strong>BLUR 18</strong>
          <p>glass · 62% opacity</p>
        </div>
      </section>

      <div class="ticker glass" aria-label="Тестовая строка">
        <span class="ticker__label">TEST</span>
        <div class="ticker__track"><p>TRANSPARENT WEBVIEW&nbsp;&nbsp;·&nbsp;&nbsp;CSS BLUR&nbsp;&nbsp;·&nbsp;&nbsp;60 FPS MOTION&nbsp;&nbsp;·&nbsp;&nbsp;SAFE AREA&nbsp;&nbsp;·&nbsp;&nbsp;</p></div>
      </div>

      <div class="reticle" aria-hidden="true"><span></span></div>
      <p class="hint">1920 × 1080 reference · tap-through overlay</p>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
